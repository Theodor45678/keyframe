<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Georgia, 'Times New Roman', Times, serif;
        }
        .slider-container{
            width: 600px;
            height: 300px;
            overflow: hidden;
            border: 5px solid whitesmoke;
            border-radius: 10px;
            box-shadow: 0 5px 15px red;
        }
        .slide{
            width: 33.333%;
            height: 100%;
            object-fit: cover;
        }
        .slider-wrapper{
            display: flex;
            width: 300%;
            animation: slideAnimation 5s infinite;
        }
        @keyframes slideAnimation {
            0%, 25%{
                transform: translateX(0);
            }
        33%, 58%{
                transform: translateX(-33.33%);
            }
        66%, 91%{
                transform: translateX(-66.66%);
            }
        100%{
                transform: translateX(0);
            }
        }

    </style>
</head>
<body>
    <div class="slider-container">
        <div class="slider-wrapper">
            <img src="https://picsum.photos/id/1018/600/300" alt="green-mountain" class="slide">
            <img src="https://picsum.photos/id/1015/600/300" alt="green-mountain" class="slide">
            <img src="https://picsum.photos/id/1019/600/300" alt="green-mountain" class="slide">
        </div>
    </div>
</body>
</html>
